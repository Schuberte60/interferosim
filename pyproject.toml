# pyproject.toml -- package definition of interferosim
# Version 1.0.1 (2026-11-09): development dependencies as PEP 735
#   dependency groups (test, docs, dev) for uv; uv.lock committed.
#   The optional extras stay unchanged, so pip users keep ".[notebooks,test]".
# Version 1.0.2 (2026-11-09): version number only (live demo 0.2.0).
# Version 1.0.3 (2026-11-09): version number only (live demo 0.2.1).
# Version 1.0.4 (2026-11-23): test tools pytest-cov and Hypothesis in the
#   extra/group "test"; doctests of src/interferosim run with every pytest
#   call (--doctest-modules); coverage settings with fail_under = 75.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interferosim"
version = "1.0.4"
description = "Open-source simulator for radio interferometry with interactive teaching notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Erich Schubert"}]
# Same base dependencies as aas6sim 1.1.0, plus matplotlib for plotting.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipywidgets>=8", "ipykernel"]
# 1.0.4: pytest-cov (line coverage) and hypothesis (property-based tests)
test = ["pytest>=7", "nbval", "pytest-cov>=5", "hypothesis>=6"]
docs = ["sphinx>=7", "furo", "myst-parser", "sphinx-copybutton"]

# Development dependencies (PEP 735). They are NOT installed by
# "pip install ." and are never published with the package; uv installs
# the group "dev" by default ("uv sync"). The runtime dependencies are only
# those in [project] dependencies above.
[dependency-groups]
test = ["pytest>=7", "nbval", "pytest-cov>=5", "hypothesis>=6"]   # 1.0.4: + pytest-cov, hypothesis
docs = ["sphinx>=7", "furo", "myst-parser", "sphinx-copybutton"]
dev = [
    # notebooks are part of the daily development work (and of the nbval tests)
    "jupyterlab",
    "ipywidgets>=8",
    "ipykernel",
    {include-group = "test"},
]

[tool.uv]
# "uv sync" installs the runtime dependencies plus the group "dev";
# the documentation tools come with "uv sync --group docs".
default-groups = ["dev"]

[project.scripts]
interferosim-sky = "interferosim.sky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interferosim = ["py.typed"]

[tool.pytest.ini_options]
# 1.0.4: the package itself is collected too, so the examples in the
# docstrings run as doctests with every "pytest" call
#testpaths = ["tests"]
testpaths = ["tests", "src/interferosim"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

# 1.0.4: line coverage of the package, measured with pytest-cov:
#   pytest --cov            (report in the terminal, fails below 75 %)
#   pytest --cov --cov-report=html   (HTML report in htmlcov/)
[tool.coverage.run]
source = ["interferosim"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
